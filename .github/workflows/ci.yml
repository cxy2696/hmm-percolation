name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: C and C++ tests
        run: make check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared library
        run: make shared
      - name: Python bindings
        run: |
          PYTHONPATH=bindings/python python -m unittest discover -s bindings/python/tests -v

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Build shared library
        run: make shared
      - name: Julia bindings
        run: julia --startup-file=no bindings/julia/test/runtests.jl

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake -j2
      - name: CTest
        run: ctest --test-dir build/cmake --output-on-failure
